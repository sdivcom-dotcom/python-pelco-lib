[project]
name = "python-pelco-lib"
version = "0.2.0"
description = "Build and send Pelco-D and Pelco-P messages for PTZ cameras"
readme = "README_en.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }
keywords = ["pelco", "pelco-d", "pelco-p", "ptz", "camera", "rs485", "cctv"]

authors = [
  { name = "S. Kleiman", email = "sdivcom@yandex.ru" },
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Topic :: System :: Hardware :: Hardware Drivers",
  "Topic :: Multimedia :: Video :: Capture",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "pyserial",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
"Homepage" = "https://github.com/sdivcom-dotcom/python-pelco-lib"
"Source" = "https://github.com/sdivcom-dotcom/python-pelco-lib"
"Bug Reports" = "https://github.com/sdivcom-dotcom/python-pelco-lib/issues"

[tool.setuptools]
packages = ["python_pelco_lib"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
